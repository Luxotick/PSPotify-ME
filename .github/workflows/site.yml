name: Theme site

# Builds the theme editor and gallery (site/, scripts/build_site.py): the
# interface compiled to WebAssembly, every theme in themes/ with a picture
# taken by the PC preview, and the latest release's EBOOT for the app's
# update check. A push to master publishes it on GitHub Pages; a pull
# request that adds or changes a theme only builds it, as a check. A new
# release rebuilds master's site, since Pages only deploys from master.
on:
  push:
    branches: [master]
    paths:
      - "themes/**"
      - "site/**"
      - "ui/**"
      - "tools/preview/**"
      - "scripts/build_preview.py"
      - "scripts/build_site.py"
      - "scripts/ui_assets.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths: ["themes/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: "6.0.12"
  # The emsdk repository at the 6.0.12 tag.
  EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220

jobs:
  republish:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Rebuild master's site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "${{ github.repository }}" --ref master

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build host helpers
        # fontTools subsets the UI fonts; SDL2 builds the PC preview that takes the pictures.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
          pip install fonttools==4.55.0

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: |
            .emsdk
            ~/.cache/emscripten
          key: emsdk-${{ env.EMSDK_COMMIT }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        run: |
          if [ ! -d .emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git .emsdk
            git -C .emsdk checkout --detach "$EMSDK_COMMIT"
            .emsdk/emsdk install "$EMSDK_VERSION"
          fi
          test "$(git -C .emsdk rev-parse HEAD)" = "$EMSDK_COMMIT"
          .emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the browser preview
        run: |
          source .emsdk/emsdk_env.sh
          python3 scripts/build_preview.py --web --library site/library

      - name: Build the PC preview
        run: python3 scripts/build_preview.py --library site/library

      - name: Fetch the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases?per_page=10" \
                --jq '[.[] | select(.draft == false)][0].tag_name // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "${{ github.repository }}" --pattern PSPotify-ME.zip --dir _release
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          fi

      - name: Build the site
        run: |
          if [ -n "${RELEASE_TAG:-}" ]; then
            python3 scripts/build_site.py --out _site --release-zip _release/PSPotify-ME.zip --release-tag "$RELEASE_TAG"
          else
            python3 scripts/build_site.py --out _site
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
